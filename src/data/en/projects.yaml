# To add a project, just append an entry to this list.
# - image: path under public/ (e.g. "/images/my-project.png"). Leave empty for the default placeholder.
# - lien: repo or demo URL. Leave empty to auto-build from PUBLIC_GITHUB_URL/<slug>.
# - nom: add a trailing "!" (e.g. "Chocolatine!") to feature the project on the homepage.
#   The "!" is stripped from the display.
# - cv: true to show the project in the "Projects & contributions" section of the
#   generated résumé (/cv, /en/cv). Independent from the "!" on nom — the résumé
#   selection doesn't necessarily match the homepage one.
# - tags: "Category:Value" format (e.g. "Languages:Python"). A trailing "!" on the value
#   (e.g. "Languages:Python!") features that skill on the homepage and résumé. These tags
#   also feed the Skills section, computed automatically from these plus the experience
#   entries (src/data/en/profile.yaml). Categories used: Languages, Tools, Methodologies, Domains.

- slug: "chocolatine"
  nom: "Chocolatine!"
  description_courte: "MySQL query builder in Python"
  description: >
    A Python library for building complex SQL queries programmatically, with
    full IDE autocompletion and runtime type checking. Supports joins,
    subqueries, CTEs (including recursive ones), window functions,
    aggregations and set operations (UNION/INTERSECT/EXCEPT), without ever
    resorting to string concatenation. Published on PyPI, 99% test coverage.
  tags: ["Languages:Python", "Languages:SQL!", "Domains:Query Builder", "Tools:PyPI", "Methodologies:Testing", "Methodologies:Open Source"]
  image: "/images/logo-chocolatine.jpg"
  lien: ""

- slug: "pitchoune"
  nom: "Pitchoune!"
  cv: true
  # cv_description_courte: short CV variant (1-2 lines), falls back to description_courte.
  cv_description_courte: "Data processing library (ETL), batch or streaming, with asynchronous chatbot / LLM integration."
  description_courte: "A Python library on top of Polars to load/save data and chat with LLMs."
