- slug: "legitifier"
  nom: "Legitifier!"
  description_courte: "Detects potentially fraudulent AI projects and misleading claims, to foster trust and data security across the open source ecosystem."
  description: >
    A command-line tool that evaluates the credibility of a GitHub
    repository, particularly in the AI/ML space where inflated claims are
    common. Checks social signals (star patterns, fork ratios), repository
    metadata, code quality (secrets, tests, documentation) and history
    (dormancy, Telegram funnels). Each check is a standalone YAML-defined
    heuristic, easy to audit or extend. Supports LLM-based analysis (OpenAI,
    Anthropic, or local Ollama).
  tags: ["Languages:Python", "Tools:CLI", "Domains:Security", "Methodologies:Open Source", "Tools:LLM"]
  image: "/images/logo-legitifier.jpeg"
  lien: ""

- slug: "mjolnir-agent"
  nom: "Mjolnir Agent!"
  description_courte: "An autonomous web agent running 100% locally on a consumer-grade GPU — a demonstration of hardware-constrained optimization (edge computing) — with human approval tiers and a performance benchmark."
  description: >
    An autonomous web agent running entirely locally on consumer GPUs
    (RTX), with no API keys and no data leaving the machine. Explicit task
    decomposition with success criteria, post-action verification, and
    retry budgets that force a strategy change on failure. Human
    supervision scales by action type (reads auto-approved, reversible
    writes granted per session, engaging actions requiring individual
    approval), with mechanical guardrails against URL fabrication. Hybrid
    perception: DOM-first via Playwright, falling back to vision (virtual
    desktop + OCR). Orchestration via LangGraph, inference via
    TabbyAPI/ExLlamaV3, memory/RAG via Qdrant. Measured on an 11-task
    benchmark with programmatic assertions and full audit trails: 29/33
    tasks passed on the latest campaign (88%).
  tags: ["Tools:Docker Deployment", "Tools:Docker Compose", "Tools:LangGraph!", "Domains:AI Agents!", "Tools:MCP!", "Tools:Playwright", "Tools:Qdrant", "Methodologies:RAG", "Methodologies:Open Source"]
  image: "/images/logo-mjolnir-agent.jpeg"
  lien: ""

- slug: "claudeus"
  nom: "Claudeus!"
  description_courte: "An isolated Docker sandbox to run Claude Code with --dangerously-skip-permissions without exposing the host machine."
  description: >
    An isolated Docker environment for running Claude Code with
    --dangerously-skip-permissions without exposing the host machine. Built
    on Anthropic's reference devcontainer, tailored for Python/ML work.
    Only the project directory is mounted (no access to ~/.ssh, cloud
    credentials, or the rest of the host filesystem). Default-DROP egress
    firewall with a whitelist (Anthropic API, GitHub, PyPI, Hugging Face,
    npm), non-root user required by Claude Code's permission-skip mode,
    authentication persisted in a named Docker volume, and optional
    Docker-in-Docker via sysbox-runc without --privileged.
  tags: ["Tools:Docker Deployment", "Domains:Security", "Tools:CLI", "Methodologies:Open Source"]
  image: "/images/logo-claudeus.jpeg"
  lien: ""

