accroche: >
  Passionné d'IA et de nouvelles technologies, j'allie rigueur et sens stratégique pour concevoir des solutions innovantes adaptées à vos enjeux.

bio: |
  Ingénieur IA, 10 ans d'expérience, spécialisé en IA générative depuis 2025.
  Après plusieurs années en mission (Airbus, Safran, CVG Medical, KPAM) à concevoir et industrialiser des pipelines IA de bout en bout, je cherche à m'inscrire dans la durée au sein d'un grand groupe pour porter des projets IA de leur conception à leur exploitation.
  Fine-tuning BERT/LLM, architectures RAG, agents LangGraph/MCP — socle Deep Learning et méthodes classiques de ML, dans une logique d'edge computing attentive à l'éthique de l'IA.

# Résumé spécifique au CV (page /cv), 3 lignes max. Repli sur bio ci-dessus si absent.
