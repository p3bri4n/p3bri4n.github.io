  Ingénieur logiciel depuis 10 ans, spécialisé en IA générative depuis 2025.
  J'industrialise des systèmes NLP/LLM en production : chez KPAM, la suite Athena a remplacé 15 outils legacy et multiplié par 200 le débit de classification.
  Je cherche un CDI pour porter des projets IA de la conception à l'exploitation.

