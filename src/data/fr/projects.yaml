- slug: "legitifier"
  nom: "Legitifier!"
  cv: true
  description_courte: "Détection de projets IA potentiellement frauduleux ou aux revendications trompeuses, pour plus de confiance et de sécurité dans l'écosystème open source."
  description: >
    Outil en ligne de commande qui évalue la crédibilité d'un dépôt GitHub,
    en particulier dans le domaine IA/ML où les affirmations exagérées sont
    fréquentes. Analyse les signaux sociaux (patterns de stars, ratio de forks),
    les métadonnées du dépôt, la qualité du code (secrets, tests, documentation)
    et l'historique (dormance, funnels Telegram). Chaque vérification est une
    heuristique définie en YAML, facile à auditer ou étendre. Supporte
    l'analyse par LLM (OpenAI, Anthropic ou Ollama en local).
  tags: ["Langages:Python", "Outils:CLI", "Domaines:Sécurité", "Méthodologies:Open Source", "Outils:LLM"]
  image: "/images/logo-legitifier.jpeg"
  lien: ""

- slug: "mjolnir-agent"
  nom: "Mjolnir Agent!"
  cv: true
  description_courte: "Agent web autonome tournant à 100% en local sur GPU grand public — démonstration d'optimisation sous contrainte matérielle (edge computing) — avec paliers d'approbation humaine et benchmark de performance."
  description: >
    Agent web autonome tournant entièrement en local sur GPU grand public
    (RTX), sans clé API ni donnée quittant la machine. Décomposition
    explicite des tâches avec critères de succès, vérification post-action
    et budgets de retry imposant un changement de stratégie en cas d'échec.
    Supervision humaine par paliers selon le type d'action (lecture
    auto-approuvée, écritures réversibles accordées par session, actions
    engageantes soumises à validation individuelle), avec garde-fous
    mécaniques contre la fabrication d'URL. Perception hybride : DOM en
    priorité via Playwright, repli sur la vision (bureau virtuel + OCR).
    Orchestration LangGraph, inférence via TabbyAPI/ExLlamaV3, mémoire/RAG
    via Qdrant. Mesuré sur un benchmark de 11 tâches avec assertions
    programmatiques et traçabilité complète : 29/33 tâches réussies sur la
    dernière campagne (88%).
  tags: ["Outils:Déploiement Docker", "Outils:Docker Compose", "Outils:LangGraph!", "Domaines:Agents IA!", "Outils:MCP!", "Outils:Playwright", "Outils:Qdrant", "Méthodologies:RAG", "Méthodologies:Open Source"]
  image: "/images/logo-mjolnir-agent.jpeg"
  lien: ""

- slug: "claudeus"
  nom: "Claudeus!"
  description_courte: "Sandbox Docker isolée pour faire tourner Claude Code en mode --dangerously-skip-permissions sans exposer la machine hôte."
  description: >
    Environnement Docker isolé permettant d'exécuter Claude Code avec
    --dangerously-skip-permissions sans exposer la machine hôte. Construit
    à partir du devcontainer de référence d'Anthropic, adapté aux besoins
    Python/ML. Seul le répertoire du projet est monté (pas d'accès à
    ~/.ssh, aux identifiants cloud ou au reste du système de fichiers hôte).
    Pare-feu de sortie en politique default-DROP avec liste blanche (API
    Anthropic, GitHub, PyPI, Hugging Face, npm), utilisateur non-root requis
    par le mode sans permissions de Claude Code, authentification persistée
    dans un volume Docker nommé, et option Docker-in-Docker via sysbox-runc
    sans --privileged.
  tags: ["Outils:Déploiement Docker", "Domaines:Sécurité", "Outils:CLI", "Méthodologies:Open Source"]
  image: "/images/logo-claudeus.jpeg"
  lien: ""

